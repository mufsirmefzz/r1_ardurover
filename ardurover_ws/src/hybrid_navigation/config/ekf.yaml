ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /r1a004/wheel_odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]

    imu0: /data
    # BUG-M4 FIX: Enable linear acceleration fusion (ax, ay) alongside yaw-rate.
    # Previously only wz was fused, giving the EKF no velocity correction between
    # wheel odometry updates. On an outdoor rover with wheel slip this causes
    # significant drift. Yaw (absolute heading) is still NOT fused here because
    # ArduPilot's internal EKF already fuses GPS heading — double-fusing it
    # creates conflicting yaw estimates.
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  true,  true,  true,
                  false, false, false]
